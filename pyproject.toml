[build-system]
requires = ["setuptools>=72.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-knowledge-assistant"
version = "0.1.0"
description = "A CLI tool to index and query documents using AI."
requires-python = ">=3.14"
license = "MIT"
readme = "README.md"
authors = [
    { name = "Dor Levi", email = "dorlevi694@gmail.com" }
    ]
dependencies = [
    "faiss-cpu>=1.13.2",
    "fastapi>=0.139.0",
    "numpy>=2.4.4",
    "openai>=2.33.0",
    "python-multipart>=0.0.32",
    "sentence-transformers>=5.4.1",
    # Our code never imports torch directly; sentence-transformers brings it in.
    # It is listed here because [tool.uv.sources] below only applies to
    # direct dependencies.
    "torch>=2.11.0",
    "uvicorn>=0.50.0",
]

[project.urls]
Homepage = "https://github.com/DorLevi694/ai_knowledge_assistant"
Repository = "https://github.com/DorLevi694/ai_knowledge_assistant"
Issues = "https://github.com/DorLevi694/ai_knowledge_assistant/issues"

[project.scripts]
ai-knowledge-assistant = "ai_knowledge_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["ai_knowledge_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.0",
]

# Get torch from PyTorch's CPU-only wheel index instead of PyPI: the default
# PyPI wheels drag the ~4.5 GB CUDA/GPU stack into our GPU-less Docker image.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

# The index definition itself. `explicit = true` means uv may use this index
# only for packages pinned to it above — never for anything else.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
