[build-system]
requires = ["setuptools>=72.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-knowledge-assistant"
version = "0.1.0"
description = "A CLI tool to index and query documents using AI."
requires-python = ">=3.14"
license = "MIT"
readme = "README.md"
authors = [
    { name = "Dor Levi", email = "dorlevi694@gmail.com" }
    ]
dependencies = [
    "openai>=2.18.0,<3.0.0",
    "sentence-transformers>=5.2.2,<6.0.0",
    "faiss-cpu>=1.13.2,<2.0.0", 
    "numpy>=2.4.2,<3.0.0",
    "scipy>=1.0.0"
]

[project.urls]
Homepage = "https://github.com/DorLevi694/ai_knowledge_assistant"
Repository = "https://github.com/DorLevi694/ai_knowledge_assistant"
Issues = "https://github.com/DorLevi694/ai_knowledge_assistant/issues"

[project.scripts]
ai-knowledge-assistant = "ai_knowledge_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["ai_knowledge_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
