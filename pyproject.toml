[project]
name = "ai-knowledge-assistant"
version = "0.1.0"
description = "A CLI tool to index and query documents using AI."
requires-python = ">=3.14"

dependencies = [
    "openai>=2.18.0,<3.0.0",
    "sentence-transformers>=5.2.2,<6.0.0",
    "faiss-cpu>=1.13.2,<2.0.0",
    "numpy>=2.4.2,<3.0.0",
]

[project.scripts]
ai-knowledge-assistant = "ai_knowledge_assistant.cli:main"

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["ai_knowledge_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
